<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08050a">

  <title>Szerencsekerék – Pörgető</title>

  <style>
    :root {
      --wheel-size: min(70vw, 590px);

      --bg: #080509;
      --bg2: #120712;

      --pink-dark: #c50091;
      --pink: #f019b5;
      --pink-light: #ff72d2;
      --pink-soft: #ff9de0;

      --text: #fff;
      --muted: rgba(255,255,255,.65);

      --panel: rgba(25, 5, 22, .78);
      --border: rgba(255, 77, 203, .25);

      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(255, 0, 170, .16),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(255, 0, 170, .08),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(190, 0, 130, .08),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          #120710 0%,
          #080509 55%,
          #050306 100%
        );

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       APP
    ========================================= */

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;

      gap: 28px;

      padding: 28px;

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, .035),
          rgba(255, 0, 170, .025)
        ),
        rgba(14, 5, 12, .78);

      border: 1px solid rgba(255, 55, 193, .16);

      box-shadow:
        0 35px 100px rgba(0,0,0,.75),
        0 0 80px rgba(255,0,170,.05);

      backdrop-filter: blur(18px);
    }

    .game-panel,
    .side-panel {
      min-width: 0;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;

      font-size: clamp(2rem, 5vw, 3.5rem);

      font-weight: 950;

      letter-spacing: -.055em;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #ffb9eb 45%,
          #ff38bd 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 35px rgba(255, 0, 180, .18);
    }

    .subtitle {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: .95rem;
      letter-spacing: .02em;
    }

    /* =========================================
       WHEEL AREA
    ========================================= */

    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .wheel-stage {
      position: relative;

      width: min(100%, var(--wheel-size));
      aspect-ratio: 1 / 1;

      isolation: isolate;
    }

    /*
      Pink glow behind wheel
    */

    .wheel-stage::before {
      content: "";

      position: absolute;

      inset: 10%;

      z-index: -2;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 0, 190, .30),
          transparent 68%
        );

      filter: blur(45px);

      opacity: .7;

      transition:
        opacity .4s ease,
        transform .4s ease;
    }

    .wheel-stage.winning::before {
      opacity: 1;
      transform: scale(1.12);
    }

    /* Pörgetés közben kikapcsoljuk a drága blur effektet,
       hogy mobilon is stabilabb legyen az FPS. */
    .wheel-stage.spinning::before {
      opacity: .25;
      filter: none;
    }

    .wheel-stage.spinning .wheel {
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.12),
        inset 0 0 20px rgba(70,0,50,.28);
    }

    /* =========================================
       OUTER WHEEL RING
    ========================================= */

    .wheel-shell {
      position: absolute;

      inset: 0;

      padding: clamp(10px, 1.8vw, 16px);

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #ffb1e6 0%,
          #ff68cc 22%,
          #e918aa 50%,
          #ff69ce 76%,
          #ffb5e9 100%
        );

      border: 2px solid rgba(255,255,255,.35);

      box-shadow:
        0 28px 65px rgba(0,0,0,.75),
        0 0 0 4px rgba(255, 56, 193, .15),
        0 0 45px rgba(255, 0, 170, .18),
        inset 0 3px 7px rgba(255,255,255,.5),
        inset 0 -8px 18px rgba(135,0,90,.35);
    }

    /*
      Inner ring
    */

    .wheel-shell::before {
      content: "";

      position: absolute;

      inset: 5px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.28);

      pointer-events: none;

      z-index: 10;
    }

    /*
      Small decorative inner ring
    */

    .wheel-shell::after {
      content: "";

      position: absolute;

      inset: 10px;

      border-radius: 50%;

      border: 1px solid rgba(160,0,100,.35);

      pointer-events: none;

      z-index: 10;
    }

    /* =========================================
       WHEEL
    ========================================= */

    .wheel {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 50%;

      background: #ff2ab8;

      border: 3px solid rgba(255,255,255,.22);

      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.12),
        inset 0 0 35px rgba(70,0,50,.35),
        0 3px 8px rgba(0,0,0,.4);

      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      transform-origin: center center;

      cursor: pointer;

      user-select: none;

      touch-action: manipulation;
    }

    /*
      Slight glossy overlay
    */

    .wheel::before {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 3;

      border-radius: 50%;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 28% 16%,
          rgba(255,255,255,.20),
          transparent 17%
        ),
        radial-gradient(
          circle,
          transparent 48%,
          rgba(90,0,60,.20) 100%
        );
    }

    /* =========================================
       SLICE LABELS
    ========================================= */

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;

      /* A teljes kerékmagasságú doboz miatt a felirat
         pontosan a szelet középvonalára helyezhető. */
      width: 34%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-origin: center center;
      pointer-events: none;
      text-align: center;

      color: #ffffff;
      font-size: clamp(.68rem, 1.9vw, 1rem);
      font-weight: 950;
      letter-spacing: -.02em;

      text-shadow:
        0 2px 4px rgba(90,0,60,.75),
        0 0 8px rgba(0,0,0,.25);

      will-change: transform;
      backface-visibility: hidden;
    }

    .wheel-label span {
      display: block;
      white-space: nowrap;
      color: #ffffff;
      transform-origin: center;
      will-change: transform;
    }

    /* =========================================
       CENTER HUB
    ========================================= */

    .hub {
      position: absolute;

      left: 50%;
      top: 50%;

      z-index: 8;

      width: 25%;

      aspect-ratio: 1;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 40% 32%,
          #ffffff 0%,
          #ffffff 70%,
          #f5e8f1 100%
        );

      border: 4px solid rgba(255,255,255,.9);

      box-shadow:
        0 10px 30px rgba(0,0,0,.45),
        0 0 0 7px rgba(255,255,255,.13),
        inset 0 2px 5px rgba(255,255,255,.8);

      pointer-events: none;
    }

    .hub::after {
      content: "SPIN";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color: #e800a4;

      font-size: clamp(
        .55rem,
        1.5vw,
        .85rem
      );

      font-weight: 1000;

      letter-spacing: .08em;
    }

    /* =========================================
       POINTER
    ========================================= */

    .pointer {
      position: absolute;

      left: 50%;
      top: -9px;

      z-index: 20;

      width: clamp(38px, 7vw, 58px);
      height: clamp(62px, 11vw, 84px);

      transform:
        translateX(-50%);

      pointer-events: none;

      filter:
        drop-shadow(0 8px 8px rgba(0,0,0,.5));
    }

    .pointer::before {
      content: "";

      position: absolute;

      inset: 0;

      clip-path:
        polygon(
          50% 100%,
          0 27%,
          10% 5%,
          50% 0%,
          90% 5%,
          100% 27%
        );

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #ffffff 45%,
          #f5d9ed 75%,
          #c7a5bd 100%
        );

      border-radius: 6px;
    }

    .pointer::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 9px;

      width: 40%;
      aspect-ratio: 1;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #555,
          #252027 70%
        );

      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.35);
    }

    /* =========================================
       DECORATIVE RIVETS
    ========================================= */

    .rivet {
      position: absolute;

      z-index: 15;

      width: clamp(7px, 1.3vw, 11px);
      height: clamp(7px, 1.3vw, 11px);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff,
          #f9dff1 45%,
          #c58db5 100%
        );

      border: 1px solid rgba(120,0,80,.35);

      box-shadow:
        0 2px 4px rgba(0,0,0,.3),
        inset 0 1px 1px rgba(255,255,255,.8);

      pointer-events: none;
    }

    /* =========================================
       CONTROLS
    ========================================= */

    .controls {
      width: min(560px, 100%);

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      gap: 10px;
    }

    .player-input {
      width: 100%;

      min-width: 0;

      padding: 14px 15px;

      color: white;

      border: 1px solid rgba(255,65,200,.3);

      border-radius: 13px;

      outline: none;

      background:
        rgba(255,255,255,.055);

      transition:
        border-color .16s ease,
        box-shadow .16s ease;
    }

    .player-input::placeholder {
      color: rgba(255,255,255,.45);
    }

    .player-input:focus {
      border-color: rgba(255,72,202,.8);

      box-shadow:
        0 0 0 4px rgba(255,0,170,.12),
        0 0 20px rgba(255,0,170,.08);
    }

    .spin-btn {
      min-width: 175px;

      padding: 13px 24px;

      border: 0;

      border-radius: 13px;

      color: white;

      font-weight: 1000;

      letter-spacing: .04em;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #ff63cd,
          #f000a8 48%,
          #c6008d
        );

      box-shadow:
        0 12px 30px rgba(255,0,170,.25),
        inset 0 1px 0 rgba(255,255,255,.4);

      transition:
        transform .16s ease,
        filter .16s ease,
        box-shadow .16s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);

      filter: brightness(1.08);

      box-shadow:
        0 18px 40px rgba(255,0,170,.35),
        0 0 20px rgba(255,0,170,.16);
    }

    .spin-btn:active:not(:disabled) {
      transform:
        translateY(1px)
        scale(.985);
    }

    .spin-btn:disabled {
      opacity: .45;

      cursor: not-allowed;

      box-shadow: none;
    }

    /* =========================================
       RESULT
    ========================================= */

    .result {
      width: min(560px, 100%);

      min-height: 62px;

      padding: 14px 18px;

      display: grid;

      place-items: center;

      text-align: center;

      border: 1px solid rgba(255,65,200,.2);

      border-radius: 14px;

      color: white;

      background:
        rgba(255,0,170,.055);

      transition:
        all .4s ease;
    }

    .result strong {
      color: #ff72d2;

      font-size: 1.2rem;
    }

    .result.win-active {
      border-color:
        rgba(255,90,210,.8);

      background:
        linear-gradient(
          135deg,
          rgba(255,0,170,.18),
          rgba(255,80,205,.06)
        );

      animation:
        win-bounce .55s
        cubic-bezier(.175,.885,.32,1.275),
        pink-pulse 2s
        infinite alternate ease-in-out;
    }

    .result.win-active strong {
      color: #ffffff;

      text-shadow:
        0 0 14px rgba(255,60,205,.75);
    }

    @keyframes win-bounce {
      0% {
        transform: scale(.94);
      }

      50% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes pink-pulse {
      0% {
        box-shadow:
          0 0 12px rgba(255,0,170,.15);
      }

      100% {
        box-shadow:
          0 0 30px rgba(255,0,170,.4);
      }
    }

    /* =========================================
       SIDE PANEL
    ========================================= */

    .side-panel {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .log {
      min-height: 440px;
      max-height: 560px;

      overflow: auto;

      padding: 16px;

      border: 1px solid rgba(255,55,193,.18);

      border-radius: 18px;

      background:
        linear-gradient(
          150deg,
          rgba(255,255,255,.035),
          rgba(255,0,170,.025)
        ),
        rgba(10,4,9,.86);

      backdrop-filter: blur(16px);
    }

    .log::-webkit-scrollbar {
      width: 7px;
    }

    .log::-webkit-scrollbar-thumb {
      border-radius: 99px;

      background:
        rgba(255,50,190,.3);
    }

    .log-header {
      position: sticky;

      top: -16px;

      z-index: 3;

      margin: -16px -16px 14px;

      padding: 16px;

      border-bottom:
        1px solid rgba(255,255,255,.06);

      background:
        rgba(12,4,10,.96);

      backdrop-filter: blur(14px);
    }

    .log-header h2 {
      margin: 0;

      font-size: 1.08rem;

      color: white;
    }

    .log-header p {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: .8rem;
    }

    .entry {
      position: relative;

      margin-bottom: 9px;

      padding:
        12px
        12px
        12px
        17px;

      border:
        1px solid rgba(255,255,255,.055);

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);
    }

    .entry::before {
      content: "";

      position: absolute;

      left: 0;
      top: 10px;
      bottom: 10px;

      width: 3px;

      border-radius:
        0 3px 3px 0;

      background:
        linear-gradient(
          180deg,
          #ff70d2,
          #d8009d
        );

      box-shadow:
        0 0 8px rgba(255,0,170,.3);
    }

    .entry-result {
      display: block;

      color: white;

      font-size: .92rem;

      font-weight: 750;
    }

    .entry-meta {
      display: block;

      margin-top: 4px;

      color: var(--muted);

      font-size: .75rem;
    }

    .empty {
      padding: 30px 10px;

      color: var(--muted);

      text-align: center;

      font-size: .9rem;
    }

    /* =========================================
       SIDE BUTTONS
    ========================================= */

    .side-actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }

    .secondary-btn {
      padding: 11px 12px;

      border:
        1px solid rgba(255,60,195,.22);

      border-radius: 12px;

      color: white;

      font-weight: 750;

      cursor: pointer;

      background:
        rgba(255,255,255,.045);

      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease;
    }

    .secondary-btn:hover:not(:disabled) {
      transform: translateY(-1px);

      background:
        rgba(255,0,170,.1);

      border-color:
        rgba(255,70,200,.4);
    }

    .secondary-btn:disabled {
      opacity: .5;

      cursor: not-allowed;
    }

    /* =========================================
       CONFETTI
    ========================================= */

    .confetti {
      position: fixed;

      left: 50%;
      top: 45%;

      z-index: 100;

      pointer-events: none;

      will-change:
        transform,
        opacity;

      animation:
        pink-particle
        var(--duration, 2200ms)
        cubic-bezier(.12,.78,.32,1)
        forwards;
    }

    .confetti.foil {
      width: var(--size, 10px);

      height:
        calc(var(--size, 10px) * 1.6);

      border-radius: 3px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #ff80d5,
          #ed00a8
        );

      box-shadow:
        0 0 10px rgba(255,0,170,.45);
    }

    .confetti.star {
      width: var(--size, 12px);
      height: var(--size, 12px);

      clip-path:
        polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );

      background:
        linear-gradient(
          45deg,
          #ffffff,
          #ff7ed5,
          #ec00a7
        );

      filter:
        drop-shadow(
          0 0 6px rgba(255,0,170,.7)
        );
    }

    .confetti.sparkle {
      width: var(--size, 6px);
      height: var(--size, 6px);

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 10px white,
        0 0 18px #ff2abb;
    }

    @keyframes pink-particle {
      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          translate(0,0)
          scale(.2)
          rotate(0deg);
      }

      15% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          translate(
            calc(var(--x) * .35),
            calc(var(--y) * .35)
          )
          scale(1.25)
          rotate(180deg);
      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          translate(
            var(--x),
            var(--y)
          )
          scale(.35)
          rotate(720deg);
      }
    }

    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 950px) {

      :root {
        --wheel-size: min(88vw, 600px);
      }

      body {
        padding: 12px;
      }

      .app {
        width: min(680px, 100%);

        grid-template-columns: 1fr;

        padding: 20px;
      }

      .log {
        min-height: 0;
        max-height: 380px;
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 560px) {

      :root {
        --wheel-size: min(92vw, 430px);
      }

      body {
        padding: 7px;
      }

      .app {
        padding: 16px 10px;

        gap: 20px;

        border-radius: 18px;
      }

      .header {
        margin-bottom: 7px;
      }

      h1 {
        font-size: 2.15rem;
      }

      .subtitle {
        font-size: .85rem;
      }

      .wheel-stage {
        width: var(--wheel-size);
      }

      .wheel-label {
        width: 36%;
        height: 100%;

        font-size:
          clamp(
            .58rem,
            2.7vw,
            .8rem
          );
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .spin-btn {
        width: 100%;

        min-height: 52px;
      }

      .side-actions {
        grid-template-columns: 1fr;
      }

      .log {
        max-height: 330px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =====================================
         JÁTÉK
    ====================================== -->

    <section class="game-panel">

      <header class="header">

        <h1>Szerencsekerék</h1>

        <p class="subtitle">
          Vajon milyen ajándékba ütközöl ma?
        </p>

      </header>


      <div class="wheel-area">

        <div
          id="wheelStage"
          class="wheel-stage"
        >

          <div
            class="pointer"
            aria-hidden="true"
          ></div>

          <div class="wheel-shell">

            <div
              id="wheel"
              class="wheel"
              role="button"
              tabindex="0"
              aria-label="Szerencsekerék pörgetése"
            ></div>

          </div>

          <div
            class="hub"
            aria-hidden="true"
          ></div>

        </div>


        <div class="controls">

          <input
            id="playerName"
            class="player-input"
            type="text"
            maxlength="30"
            autocomplete="name"
            placeholder="Nicknév (opcionális)"
          >

          <button
            id="spin"
            class="spin-btn"
            type="button"
          >
            PÖRGETÉS
          </button>

        </div>


        <div
          id="result"
          class="result"
          aria-live="polite"
        >
          Nyomd meg a pörgetés gombot.
        </div>

      </div>

    </section>


    <!-- =====================================
         ELŐZMÉNYEK
    ====================================== -->

    <aside class="side-panel">

      <section class="log">

        <div class="log-header">

          <h2>
            Elmentett pörgetések
          </h2>

          <p>
            A legfrissebb 20 eredmény jelenik meg.
          </p>

        </div>

        <div id="entries"></div>

      </section>


      <div class="side-actions">

        <button
          id="clear"
          class="secondary-btn"
          type="button"
        >
          Előzmények törlése
        </button>

        <button
          id="export"
          class="secondary-btn"
          type="button"
        >
          Exportálás
        </button>

      </div>

    </aside>

  </main>


  <script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAnalytics
    } from
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      query,
      orderBy,
      limit
    } from
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBtHbu1CywcEVSmx4ZiN1kZraotfGlmIq4",

      authDomain:
        "szerencsekerek-5f52b.firebaseapp.com",

      projectId:
        "szerencsekerek-5f52b",

      storageBucket:
        "szerencsekerek-5f52b.firebasestorage.app",

      messagingSenderId:
        "679689465068",

      appId:
        "1:679689465068:web:25ddb5227e60ef38c809c9",

      measurementId:
        "G-3V9VYSS6HZ"
    };


    const app =
      initializeApp(firebaseConfig);

    getAnalytics(app);

    const db =
      getFirestore(app);

    const entriesCollection =
      collection(db, "porgetesek");


    /* =========================================
       NYEREMÉNYEK
    ========================================= */

    const slices = [

      "500 Ft",
      "1000 Ft",
      "2000 Ft",
      "3000 Ft",
      "5000 Ft",
      "7000 Ft",
      "10000 Ft",
      "15000 Ft",
      "20000 Ft"

    ];


    /*
      Minél nagyobb a szám,
      annál nagyobb az esély.
    */

    const weights = [

      3,    // 500 Ft
      5,    // 1000 Ft
      7,    // 2000 Ft
      20,   // 3000 Ft
      25,   // 5000 Ft
      20,   // 7000 Ft
      15,   // 10000 Ft
      4,    // 15000 Ft
      1     // 20000 Ft

    ];


    /*
      A referencia alapján
      váltakozó pink árnyalatok.
    */

    const colors = [

      "#ff65ca",
      "#e900a5",
      "#ff72d1",
      "#d9009c",
      "#ff55c3",
      "#e500a3",
      "#ff68cc",
      "#d8009b",
      "#ff58c5"

    ];


    /* =========================================
       ELEMENTEK
    ========================================= */

    const wheel =
      document.getElementById("wheel");

    const wheelStage =
      document.getElementById("wheelStage");

    const entriesEl =
      document.getElementById("entries");

    const resultEl =
      document.getElementById("result");

    const playerNameEl =
      document.getElementById("playerName");

    const spinBtn =
      document.getElementById("spin");

    const clearBtn =
      document.getElementById("clear");

    const exportBtn =
      document.getElementById("export");


    /* =========================================
       KERÉK
    ========================================= */

    const segmentAngle =
      360 / slices.length;

    let currentRotation = 0;

    let rotating = false;

    let audioContext = null;


    function buildWheel() {

      /*
        Szeletek
      */

      const gradientStops =
        slices.map((_, i) => {

          const start =
            i * segmentAngle;

          const end =
            (i + 1) * segmentAngle;

          return `
            ${colors[i]}
            ${start}deg
            ${end}deg
          `;

        });


      wheel.style.background =
        `conic-gradient(
          from ${-segmentAngle / 2}deg,
          ${gradientStops.join(",")}
        )`;


      /*
        Feliratok
      */

      slices.forEach((text, index) => {

        const label =
          document.createElement("div");

        label.className =
          "wheel-label";

        label.style.zIndex =
          "20";

        label.style.width =
          "34%";

        label.style.height =
          "100%";

        const labelAngle =
          index * segmentAngle;

        /* A felirat a saját szeletének közepére kerül. */
        label.style.transform =
          `
            translate(-50%, -50%)
            rotate(${labelAngle}deg)
            translateY(-30%)
          `;

        const textRotation =
          labelAngle > 90 &&
          labelAngle < 270
            ? -90
            : 90;

        const span =
          document.createElement("span");

        span.textContent =
          text;

        span.style.color =
          "#ffffff";

        span.style.fontWeight =
          "900";

        span.style.fontSize =
          "clamp(.75rem, 2.1vw, 1rem)";

        span.style.textShadow =
          "0 1px 3px rgba(0,0,0,.65)";

        span.style.lineHeight =
          "1.05";

        span.style.transformOrigin =
          "center";

        span.style.transform =
          `rotate(${textRotation}deg)`;

        label.appendChild(span);

        wheel.appendChild(label);

      });


      /*
        Külső kis szegecsek.
        Ettől lesz olyan a perem,
        mint a referencia képen.
      */

      const rivetCount = 14;


      for (let i = 0; i < rivetCount; i++) {

        const rivet =
          document.createElement("div");

        rivet.className =
          "rivet";


        const angle =
          (360 / rivetCount) * i;


        /*
          48.2% sugár
        */

        const radius = 48.2;

        const x =
          50 +
          Math.sin(angle * Math.PI / 180) *
          radius;

        const y =
          50 -
          Math.cos(angle * Math.PI / 180) *
          radius;


        rivet.style.left =
          `${x}%`;

        rivet.style.top =
          `${y}%`;


        rivet.style.transform =
          "translate(-50%, -50%)";


        wheelStage.appendChild(rivet);

      }

    }


    /* =========================================
       FIREBASE – ELŐZMÉNYEK
    ========================================= */

    async function getEntries() {

      try {

        const q =
          query(
            entriesCollection,
            orderBy("createdAt", "desc"),
            limit(20)
          );


        const snapshot =
          await getDocs(q);


        return snapshot.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

      }

      catch (err) {

        console.error(
          "Firebase lekérdezési hiba:",
          err
        );

        return null;

      }

    }


    async function renderEntries() {

      entriesEl.replaceChildren();


      const loading =
        document.createElement("div");

      loading.className =
        "empty";

      loading.textContent =
        "Betöltés...";

      entriesEl.appendChild(
        loading
      );


      const entries =
        await getEntries();


      entriesEl.replaceChildren();


      if (entries === null) {

        const error =
          document.createElement("div");

        error.className =
          "empty";

        error.textContent =
          "Hiba történt az előzmények betöltésekor.";

        entriesEl.appendChild(error);

        return;

      }


      if (!entries.length) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "Még nincs elmentett pörgetés.";

        entriesEl.appendChild(empty);

        return;

      }


      entries.forEach(entry => {

        const item =
          document.createElement("div");

        item.className =
          "entry";


        const result =
          document.createElement("span");

        result.className =
          "entry-result";


        result.textContent =
          entry.player
            ? `${entry.player}: ${entry.result}`
            : entry.result;


        const meta =
          document.createElement("span");

        meta.className =
          "entry-meta";

        meta.textContent =
          entry.time;


        item.append(
          result,
          meta
        );


        entriesEl.appendChild(item);

      });

    }


    /* =========================================
       HANG
    ========================================= */

    function ensureAudio() {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }

    }


    function playTick() {

      if (!audioContext)
        return;


      const now =
        audioContext.currentTime;


      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();


      osc.type =
        "sine";


      osc.frequency.setValueAtTime(
        210,
        now
      );


      osc.frequency.exponentialRampToValueAtTime(
        105,
        now + .03
      );


      gain.gain.setValueAtTime(
        .065,
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .05
      );


      osc.connect(gain);

      gain.connect(
        audioContext.destination
      );


      osc.start(now);

      osc.stop(
        now + .05
      );

    }


    function playWinSound() {

      if (!audioContext)
        return;


      const notes = [

        523.25,
        659.25,
        783.99,
        1046.5

      ];


      notes.forEach(
        (frequency, i) => {

          const now =
            audioContext.currentTime +
            i * .14;


          const osc =
            audioContext.createOscillator();

          const gain =
            audioContext.createGain();


          osc.type =
            "triangle";

          osc.frequency.value =
            frequency;


          gain.gain.setValueAtTime(
            0,
            now
          );


          gain.gain.linearRampToValueAtTime(
            .05,
            now + .02
          );


          gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .7
          );


          osc.connect(gain);

          gain.connect(
            audioContext.destination
          );


          osc.start(now);

          osc.stop(
            now + .7
          );

        }
      );

    }


    /* =========================================
       CONFETTI
    ========================================= */

    function launchConfetti() {

      const types = [

        "foil",
        "star",
        "sparkle"

      ];


      for (
        let wave = 0;
        wave < 3;
        wave++
      ) {

        setTimeout(() => {

          const particleCount =
            wave === 0
              ? 40
              : 25;


          for (
            let i = 0;
            i < particleCount;
            i++
          ) {

            const particle =
              document.createElement("div");


            const type =
              types[
                Math.floor(
                  Math.random() *
                  types.length
                )
              ];


            particle.className =
              `confetti ${type}`;


            const angle =
              Math.random() *
              Math.PI *
              2;


            const distance =
              140 +
              Math.random() *
              480;


            const x =
              Math.cos(angle) *
              distance;


            const y =
              Math.sin(angle) *
              distance -
              60;


            const size =
              6 +
              Math.random() *
              9;


            const duration =
              1800 +
              Math.random() *
              1000;


            particle.style.setProperty(
              "--x",
              `${x}px`
            );


            particle.style.setProperty(
              "--y",
              `${y}px`
            );


            particle.style.setProperty(
              "--size",
              `${size}px`
            );


            particle.style.setProperty(
              "--duration",
              `${duration}ms`
            );


            document.body.appendChild(
              particle
            );


            setTimeout(
              () => particle.remove(),
              duration + 100
            );

          }

        }, wave * 220);

      }

    }


    /* =========================================
       SEGÉDFÜGGVÉNYEK
    ========================================= */

    function easeOutQuint(value) {

      return 1 -
        Math.pow(
          1 - value,
          5
        );

    }


    function normalizeDegrees(value) {

      return (
        (value % 360) +
        360
      ) % 360;

    }


    /* =========================================
       SÚLYOZOTT NYERTES
    ========================================= */

    function selectWeightedWinner() {

      const totalWeight =
        weights.reduce(
          (sum, weight) =>
            sum + weight,
          0
        );


      let random =
        Math.random() *
        totalWeight;


      for (
        let i = 0;
        i < weights.length;
        i++
      ) {

        random -=
          weights[i];


        if (random <= 0)
          return i;

      }


      return slices.length - 1;

    }


    /* =========================================
       MENTÉS
    ========================================= */

    async function saveResult(result) {

      const player =
        playerNameEl.value.trim();


      try {

        await addDoc(
          entriesCollection,
          {

            player,

            result,

            time:
              new Date()
                .toLocaleString("hu-HU"),

            createdAt:
              Date.now()

          }
        );


        await renderEntries();

      }

      catch (err) {

        console.error(
          "Mentési hiba:",
          err
        );

      }

    }


    /* =========================================
       PÖRGETÉS
    ========================================= */

    function spin() {

      if (rotating)
        return;


      ensureAudio();


      rotating = true;

      wheelStage.classList.add("spinning");

      spinBtn.disabled = true;


      resultEl.classList.remove(
        "win-active"
      );


      wheelStage.classList.remove(
        "winning"
      );


      resultEl.textContent =
        "Pörög a kerék…";


      /*
        Súlyozott nyertes
      */

      const winnerIndex =
        selectWeightedWinner();


      /*
        6-8 teljes kör
      */

      const rounds =
        6 +
        Math.floor(
          Math.random() * 3
        );


      /*
        Kerék pontos beállítása
        a nyertes szelet közepére.
      */

      const currentNormalized =
        normalizeDegrees(
          currentRotation
        );


      const desiredNormalized =
        normalizeDegrees(
          -winnerIndex *
          segmentAngle
        );


      const alignmentDelta =
        normalizeDegrees(
          desiredNormalized -
          currentNormalized
        );


      const startRotation =
        currentRotation;


      const targetRotation =
        currentRotation +
        rounds * 360 +
        alignmentDelta;


      const duration =
        4700 +
        Math.random() * 700;


      const startedAt =
        performance.now();


      let lastTickSegment =
        null;


      function animate(now) {

        const progress =
          Math.min(
            (now - startedAt) /
            duration,
            1
          );


        const eased =
          easeOutQuint(
            progress
          );


        const rotation =
          startRotation +
          (
            targetRotation -
            startRotation
          ) *
          eased;


        currentRotation =
          rotation;


        wheel.style.transform =
          `translate3d(0, 0, 0) rotate(${rotation}deg)`;


        const tickSegment =
          Math.floor(
            normalizeDegrees(
              rotation +
              segmentAngle / 2
            ) /
            segmentAngle
          );


        if (
          tickSegment !==
          lastTickSegment
        ) {

          playTick();

          lastTickSegment =
            tickSegment;

        }


        if (progress < 1) {

          requestAnimationFrame(
            animate
          );

          return;

        }


        currentRotation =
          targetRotation;


        wheel.style.transform =
          `translate3d(0, 0, 0) rotate(${currentRotation}deg)`;


        const result =
          slices[winnerIndex];


        resultEl.innerHTML =
          `
            Az eredmény:
            <strong>${result}</strong>
          `;


        resultEl.classList.add(
          "win-active"
        );


        wheelStage.classList.add(
          "winning"
        );


        saveResult(result);

        playWinSound();

        launchConfetti();

        wheelStage.classList.remove("spinning");

        rotating = false;

        spinBtn.disabled = false;

      }


      requestAnimationFrame(
        animate
      );

    }


    /* =========================================
       ESEMÉNYEK
    ========================================= */

    spinBtn.addEventListener(
      "click",
      spin
    );


    wheel.addEventListener(
      "click",
      spin
    );


    playerNameEl.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          spin();

        }

      }
    );


    wheel.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          spin();

        }

      }
    );


    /* =========================================
       TÖRLÉS
    ========================================= */

    clearBtn.addEventListener(
      "click",
      async () => {

        if (
          !confirm(
            "Biztosan törlöd az összes pörgetést?"
          )
        ) {
          return;
        }


        clearBtn.disabled =
          true;


        try {

          const snapshot =
            await getDocs(
              entriesCollection
            );


          await Promise.all(
            snapshot.docs.map(
              d =>
                deleteDoc(
                  doc(
                    db,
                    "porgetesek",
                    d.id
                  )
                )
            )
          );


          await renderEntries();


          resultEl.classList.remove(
            "win-active"
          );


          wheelStage.classList.remove(
            "winning"
          );


          resultEl.textContent =
            "Az előzmények törölve.";

        }

        catch (err) {

          alert(
            "Hiba történt a törlés során."
          );

        }

        finally {

          clearBtn.disabled =
            false;

        }

      }
    );


    /* =========================================
       EXPORT
    ========================================= */

    exportBtn.addEventListener(
      "click",
      async () => {

        exportBtn.disabled =
          true;


        const data =
          await getEntries();


        exportBtn.disabled =
          false;


        if (!data)
          return;


        const blob =
          new Blob(
            [
              JSON.stringify(
                data,
                null,
                2
              )
            ],
            {
              type:
                "application/json"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement("a");


        link.href =
          url;


        link.download =
          "szerencsekerek-porgetesek.json";


        link.click();


        setTimeout(
          () =>
            URL.revokeObjectURL(url),
          1000
        );

      }
    );


    /* =========================================
       INDÍTÁS
    ========================================= */

    function init() {

      buildWheel();

      renderEntries();

    }


    init();

  </script>

</body>
