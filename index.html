<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Szerencsekerék – Pörgető</title>

  <style>
    :root {
      --wheel-size: min(68vw, 590px);
      --bg: #050302;
      --panel: rgba(18, 12, 10, 0.66);
      --border: rgba(212, 175, 55, 0.24);
      --text: #f4ebd8;
      --muted: rgba(244, 235, 216, 0.62);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(212, 175, 55, 0.13), transparent 9%),
        radial-gradient(circle at 82% 18%, rgba(143, 29, 33, 0.12), transparent 14%),
        linear-gradient(180deg, var(--bg), #070404 58%);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 26px;
      padding: 30px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), var(--panel));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 5px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(212,175,55,0.06);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px) saturate(1.05);
    }

    .game-panel, .side-panel { min-width: 0; }
    .header { margin-bottom: 18px; text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1;
      letter-spacing: -0.055em;
      background: linear-gradient(90deg, #fff7df, #f5d77a 45%, #d4af37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(0.92rem, 2vw, 1rem);
    }

    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .wheel-stage {
      position: relative;
      width: min(100%, var(--wheel-size));
      aspect-ratio: 1 / 1;
      height: auto;
      max-width: 100%;
      isolation: isolate;
    }

    .wheel-stage::before {
      content: "";
      position: absolute;
      inset: 9%;
      z-index: -1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%, rgba(212,175,55,0.22), transparent 18%),
        radial-gradient(circle at 62% 22%, rgba(143, 24, 29, 0.18), transparent 16%);
      filter: blur(52px);
      opacity: 0.54;
      transition: opacity 600ms ease, filter 600ms ease;
    }

    .wheel-stage.winning::before {
      opacity: 0.95;
      filter: blur(40px);
      background:
        radial-gradient(circle at 50% 50%, rgba(245, 215, 122, 0.45), transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.3), transparent 75%);
    }

    .wheel-shell {
      position: absolute;
      inset: 0;
      padding: clamp(9px, 1.7vw, 15px);
      border-radius: 50%;
      background: linear-gradient(145deg, #110b0a, #2c1614 22%, #0c0706 48%, #3f1814 75%, #120a08);
      box-shadow:
        0 32px 78px rgba(0, 0, 0, 0.72),
        0 0 0 4px rgba(212,175,55,0.18),
        inset 0 0 48px rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.16);
      transition: box-shadow 400ms ease;
    }

    .wheel-stage.winning .wheel-shell {
      box-shadow:
        0 32px 90px rgba(212, 175, 55, 0.35),
        0 0 0 6px rgba(245, 215, 122, 0.5),
        inset 0 0 60px rgba(212, 175, 55, 0.25);
    }

    .wheel-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      background: #080503;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.12), inset 0 0 46px rgba(0, 0, 0, 0.58);
      will-change: transform;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .wheel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.18), transparent 15%),
        radial-gradient(circle, transparent 52%, rgba(0, 0, 0, 0.32) 100%);
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: 50%;
      pointer-events: none;
      background: var(--slice-outline);
      opacity: 0.95;
    }

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;
      width: clamp(29%, 96px, 36%);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      text-align: center;
      color: #f6ecd5;
      font-weight: 850;
      font-size: clamp(0.58rem, 1.35vw, 0.9rem);
      line-height: 1.06;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.72), 0 0 8px rgba(0, 0, 0, 0.22);
      pointer-events: none;
      padding: 0 8px;
    }

    .wheel-label span {
      display: block;
      transform: rotate(90deg);
      white-space: normal;
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: 25%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border: clamp(5px, 1vw, 9px) solid rgba(212,175,55,0.75);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff9e2, #d4af37 28%, #241511 70%, #0e0806);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.68), 0 0 0 8px rgba(0, 0, 0, 0.18), inset 0 1px 5px rgba(255, 255, 255, 0.22);
      pointer-events: none;
    }

    .hub::after {
      content: "SPIN";
      font-size: clamp(0.7rem, 2vw, 1rem);
      font-weight: 950;
      letter-spacing: 0.08em;
      color: #2a180f;
      text-shadow: 0 1px 0 #f8e7c6;
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: -7px;
      z-index: 12;
      width: clamp(36px, 7vw, 54px);
      height: clamp(57px, 11vw, 78px);
      transform: translateX(-50%);
      pointer-events: none;
      filter: drop-shadow(0 9px 8px rgba(0, 0, 0, 0.45));
      transition: filter 300ms ease;
    }

    .wheel-stage.winning .pointer {
      filter: drop-shadow(0 0 12px rgba(245, 215, 122, 0.8));
    }

    .pointer::before {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 100%, 0 24%, 14% 4%, 86% 4%, 100% 24%);
      background: linear-gradient(145deg, #f2e6c7, #c99c3e 48%, #5d311f);
    }

    .pointer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 42%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #7c4f23;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.22);
    }

    .controls {
      width: min(560px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .player-input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      color: var(--text);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 13px;
      outline: none;
      background: rgba(255, 255, 255, 0.06);
      transition: 160ms ease;
    }

    .player-input:focus {
      border-color: rgba(212,175,55,0.45);
      box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
    }

    .spin-btn {
      min-width: 170px;
      padding: 13px 24px;
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 13px;
      color: #19120b;
      font-weight: 900;
      letter-spacing: 0.03em;
      cursor: pointer;
      background: linear-gradient(135deg, #f5d77a, #d4af37 40%, #ab8a2e);
      box-shadow: 0 18px 40px rgba(212,175,55,0.18), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 22px 44px rgba(212,175,55,0.24);
      background: linear-gradient(135deg, #fff3bf, #d4af37 55%, #9a7a24);
    }

    .spin-btn:active:not(:disabled) { transform: translateY(1px) scale(0.985); }

    .spin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(0.35);
      box-shadow: none;
    }

    .result {
      width: min(560px, 100%);
      min-height: 64px;
      padding: 14px 18px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 14px;
      color: #f7eed9;
      background: rgba(212,175,55,0.08);
      transition: all 400ms ease;
    }

    .result strong { color: #fff9e7; font-size: 1.15rem; }

    .result.win-active {
      border-color: rgba(212, 175, 55, 0.7);
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(75,17,20,0.45));
      animation: win-bounce 550ms cubic-bezier(0.175, 0.885, 0.32, 1.275), luxury-pulse 2000ms infinite alternate ease-in-out;
    }

    .result.win-active strong {
      color: #fff4d0;
      text-shadow: 0 0 12px rgba(245, 215, 122, 0.6);
    }

    @keyframes win-bounce {
      0% { transform: scale(0.94); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes luxury-pulse {
      0% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.25), inset 0 0 10px rgba(212, 175, 55, 0.1); }
      100% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.55), inset 0 0 20px rgba(245, 215, 122, 0.25); }
    }

    .side-panel { display: flex; flex-direction: column; gap: 12px; }

    .log {
      min-height: 440px;
      max-height: 560px;
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 18px;
      background: linear-gradient(150deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), rgba(10, 8, 8, 0.84);
      backdrop-filter: blur(16px);
    }

    .log::-webkit-scrollbar { width: 8px; }
    .log::-webkit-scrollbar-thumb { border-radius: 99px; background: rgba(212,175,55,0.24); }

    .log-header {
      position: sticky;
      top: -16px;
      z-index: 3;
      margin: -16px -16px 14px;
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(12, 9, 8, 0.96);
      backdrop-filter: blur(14px);
    }

    .log-header h2 { margin: 0; font-size: 1.08rem; color: #f8edd8; }
    .log-header p { margin: 5px 0 0; color: var(--muted); font-size: 0.8rem; }

    .entry {
      position: relative;
      margin-bottom: 9px;
      padding: 12px 12px 12px 16px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    .entry::before {
      content: "";
      position: absolute;
      left: 0; top: 11px; bottom: 11px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, #f5d77a, #7f141b);
      box-shadow: 0 0 8px rgba(212,175,55,0.24);
    }

    .entry-result { display: block; color: #fbf1da; font-size: 0.92rem; font-weight: 750; }
    .entry-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 0.75rem; }
    .empty { padding: 30px 10px; color: var(--muted); text-align: center; font-size: 0.9rem; }

    .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    .secondary-btn {
      padding: 11px 12px;
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 12px;
      color: #f7edd8;
      font-weight: 750;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      transition: 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .secondary-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .secondary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .confetti {
      position: fixed;
      left: 50%; top: 45%;
      z-index: 100;
      pointer-events: none;
      will-change: transform, opacity;
      animation: vip-particle-burst var(--duration, 2200ms) cubic-bezier(0.12, 0.78, 0.32, 1) forwards;
    }

    .confetti.foil {
      width: var(--size, 10px);
      height: calc(var(--size, 10px) * 1.6);
      border-radius: 2px;
      background: linear-gradient(135deg, #fff7df, #d4af37 40%, #7f141b 85%, #f5d77a);
      background-size: 200% 200%;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
      animation:
        vip-particle-burst var(--duration, 2200ms) cubic-bezier(0.12, 0.78, 0.32, 1) forwards,
        foil-shimmer 700ms linear infinite alternate;
    }

    .confetti.star {
      width: var(--size, 12px);
      height: var(--size, 12px);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: linear-gradient(45deg, #ffffff, #f5d77a, #d4af37);
      filter: drop-shadow(0 0 6px rgba(245, 215, 122, 0.7));
    }

    .confetti.sparkle {
      width: var(--size, 6px);
      height: var(--size, 6px);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #fff7df, 0 0 18px #d4af37;
    }

    @keyframes vip-particle-burst {
      0% { opacity: 0; transform: translate(-50%, -50%) translate(0, 0) scale(0.2) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      15% { opacity: 1; transform: translate(-50%, -50%) translate(calc(var(--x) * 0.35), calc(var(--y) * 0.35)) scale(1.25) rotateX(120deg) rotateY(180deg) rotateZ(90deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(0.35) rotateX(720deg) rotateY(900deg) rotateZ(450deg); }
    }

    @keyframes foil-shimmer {
      0% { background-position: 0% 0%; filter: brightness(1); }
      100% { background-position: 100% 100%; filter: brightness(1.7); }
    }

    @media (max-width: 950px) {
      :root { --wheel-size: min(88vw, 600px); }
      body { align-items: start; }
      .app { width: min(680px, 100%); grid-template-columns: 1fr; }
      .log { min-height: 0; max-height: 380px; }
    }

    @media (max-width: 560px) {
      :root { --wheel-size: min(91vw, 430px); }
      body { padding: 10px; }
      .app { padding: 16px 12px; gap: 20px; border-radius: 18px; }
      .header { margin-bottom: 10px; }
      .controls { grid-template-columns: 1fr; }
      .spin-btn { width: 100%; min-height: 50px; }
      .wheel-label { width: 34%; font-size: clamp(0.56rem, 2.7vw, 0.78rem); }
      .pointer { top: -5px; }
      .side-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="game-panel">
      <header class="header">
        <h1>Szerencsekerék</h1>
        <p class="subtitle">Vajon milyen ajándékba ütközöl ma?</p>
      </header>

      <div class="wheel-area">
        <div id="wheelStage" class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel-shell">
            <div id="wheel" class="wheel" role="button" tabindex="0" aria-label="Szerencsekerék pörgetése"></div>
          </div>
          <div class="hub" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <input id="playerName" class="player-input" type="text" maxlength="30" autocomplete="name" placeholder="Nicknév (opcionális)">
          <button id="spin" class="spin-btn" type="button">PÖRGETÉS</button>
        </div>

        <div id="result" class="result" aria-live="polite">Nyomd meg a pörgetés gombot.</div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="log">
        <div class="log-header">
          <h2>Elmentett pörgetések</h2>
          <p>A legfrissebb 20 eredmény jelenik meg.</p>
        </div>
        <div id="entries"></div>
      </section>

      <div class="side-actions">
        <button id="clear" class="secondary-btn" type="button">Előzmények törlése</button>
        <button id="export" class="secondary-btn" type="button">Exportálás</button>
      </div>
    </aside>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      query,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtHbu1CywcEVSmx4ZiN1kZraotfGlmIq4",
      authDomain: "szerencsekerek-5f52b.firebaseapp.com",
      projectId: "szerencsekerek-5f52b",
      storageBucket: "szerencsekerek-5f52b.firebasestorage.app",
      messagingSenderId: "679689465068",
      appId: "1:679689465068:web:25ddb5227e60ef38c809c9",
      measurementId: "G-3V9VYSS6HZ"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);
    const entriesCollection = collection(db, "porgetesek");

    const slices = ["500 Ft", "1000 Ft", "2000 Ft", "3000 Ft", "5000 Ft", "7000 Ft", "10000 Ft", "15000 Ft", "20000 Ft"];
    const weights = [
      50,    // 500 Ft
      27,    // 1000 Ft
      15,    // 2000 Ft
      4,     // 3000 Ft
      2.5,   // 5000 Ft
      0.35,  // 7000 Ft
      0.1,   // 10000 Ft
      0.04,  // 15000 Ft
      0.01   // 20000 Ft
    ];
    const colors = ["#d4af37", "#c49c2f", "#b38a28", "#a67822", "#95641d", "#845618", "#744a15", "#653f12", "#58350f"];

    const wheel = document.getElementById("wheel");
    const wheelStage = document.getElementById("wheelStage");
    const entriesEl = document.getElementById("entries");
    const resultEl = document.getElementById("result");
    const playerNameEl = document.getElementById("playerName");
    const spinBtn = document.getElementById("spin");
    const clearBtn = document.getElementById("clear");
    const exportBtn = document.getElementById("export");

    const segmentAngle = 360 / slices.length;
    let currentRotation = 0;
    let rotating = false;
    let audioContext = null;

    function buildWheel() {
      wheel.style.setProperty("--segment-angle", `${segmentAngle}deg`);
      const gradientStops = slices.map((_, i) => {
        const start = i * segmentAngle;
        const end = (i + 1) * segmentAngle;
        return `${colors[i % colors.length]} ${start}deg ${end}deg`;
      });

      wheel.style.background = `conic-gradient(from ${-segmentAngle / 2}deg, ${gradientStops.join(",")})`;

      slices.forEach((text, index) => {
        const label = document.createElement("div");
        label.className = "wheel-label";
        label.style.transform = `translate(-50%, -50%) rotate(${index * segmentAngle}deg) translateY(calc(var(--wheel-size) * -0.34))`;
        
        const span = document.createElement("span");
        span.textContent = text;
        label.appendChild(span);
        wheel.appendChild(label);
      });
    }

    async function getEntries() {
      try {
        const q = query(entriesCollection, orderBy("createdAt", "desc"), limit(20));
        const snapshot = await getDocs(q);
        return snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error("Firebase lekérdezési hiba:", err);
        return null;
      }
    }

    async function renderEntries() {
      entriesEl.replaceChildren();
      const loading = document.createElement("div");
      loading.className = "empty";
      loading.textContent = "Betöltés...";
      entriesEl.appendChild(loading);

      const entries = await getEntries();
      entriesEl.replaceChildren();

      if (entries === null) {
        const errEl = document.createElement("div");
        errEl.className = "empty";
        errEl.textContent = "Hiba történt az előzmények betöltésekor.";
        entriesEl.appendChild(errEl);
        return;
      }

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Még nincs elmentett pörgetés.";
        entriesEl.appendChild(empty);
        return;
      }

      entries.forEach((entry) => {
        const item = document.createElement("div");
        item.className = "entry";

        const result = document.createElement("span");
        result.className = "entry-result";
        result.textContent = entry.player ? `${entry.player}: ${entry.result}` : entry.result;

        const meta = document.createElement("span");
        meta.className = "entry-meta";
        meta.textContent = entry.time;

        item.append(result, meta);
        entriesEl.appendChild(item);
      });
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(frequency, duration, volume, type = "sine") {
      if (!audioContext) return;
      try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const now = audioContext.currentTime;

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + duration);
      } catch {}
    }

    function playTick() {
      if (!audioContext) return;

      const now = audioContext.currentTime;

      // Mély mechanikus kattanás
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.03);

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(now);
      osc.stop(now + 0.05);

      // Finom magas fémes csengés
      const bell = audioContext.createOscillator();
      const bellGain = audioContext.createGain();

      bell.type = "triangle";
      bell.frequency.setValueAtTime(1600, now);

      bellGain.gain.setValueAtTime(0.015, now);
      bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

      bell.connect(bellGain);
      bellGain.connect(audioContext.destination);

      bell.start(now);
      bell.stop(now + 0.09);
    }

    function playWinSound() {
      if (!audioContext) return;

      const notes = [
        523.25, // C5
        659.25, // E5
        783.99, // G5
        1046.5  // C6
      ];

      notes.forEach((freq, i) => {
        const now = audioContext.currentTime + i * 0.14;

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + 0.7);
      });
    }

    function launchConfetti() {
      const goldPalette = [
        "linear-gradient(135deg, #fff7df, #f5d77a)",
        "linear-gradient(135deg, #f5d77a, #d4af37)",
        "linear-gradient(135deg, #d4af37, #ab8a2e)",
        "linear-gradient(135deg, #ffffff, #e6c656)",
        "linear-gradient(135deg, #7f141b, #d4af37)",
        "#ffffff"
      ];
      const types = ["foil", "star", "sparkle"];

      for (let wave = 0; wave < 3; wave++) {
        setTimeout(() => {
          const particleCount = wave === 0 ? 40 : 25;
          for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement("div");
            const type = types[Math.floor(Math.random() * types.length)];
            
            particle.className = `confetti ${type}`;
            const angle = Math.random() * Math.PI * 2;
            const distance = 140 + Math.random() * 480;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance - 60;

            const size = 6 + Math.random() * 9;
            const duration = 1800 + Math.random() * 1000;

            if (type !== "foil") {
              particle.style.background = goldPalette[i % goldPalette.length];
            }

            particle.style.setProperty("--x", `${x}px`);
            particle.style.setProperty("--y", `${y}px`);
            particle.style.setProperty("--size", `${size}px`);
            particle.style.setProperty("--duration", `${duration}ms`);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), duration + 100);
          }
        }, wave * 220);
      }
    }

    function easeOutQuint(value) {
      return 1 - Math.pow(1 - value, 5);
    }

    function normalizeDegrees(value) {
      return ((value % 360) + 360) % 360;
    }

    function selectWeightedWinner() {
      const totalWeight = weights.reduce((sum, w) => sum + w, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < weights.length; i++) {
        random -= weights[i];
        if (random <= 0) return i;
      }
      return slices.length - 1;
    }

    async function saveResult(result) {
      const player = playerNameEl.value.trim();
      try {
        await addDoc(entriesCollection, {
          player,
          result,
          time: new Date().toLocaleString("hu-HU"),
          createdAt: Date.now()
        });
        await renderEntries();
      } catch (err) {
        console.error("Mentési hiba:", err);
      }
    }

    function spin() {
      if (rotating) return;

      ensureAudio();
      rotating = true;
      spinBtn.disabled = true;

      resultEl.classList.remove("win-active");
      wheelStage.classList.remove("winning");
      resultEl.textContent = "Pörög a kerék…";

      const winnerIndex = selectWeightedWinner();
      const rounds = 6 + Math.floor(Math.random() * 3);

      // Pontosan a szelet geometriai közepére érkezik a pörgetés
      const currentNormalized = normalizeDegrees(currentRotation);
      const desiredNormalized = normalizeDegrees(-winnerIndex * segmentAngle);
      const alignmentDelta = normalizeDegrees(desiredNormalized - currentNormalized);

      const startRotation = currentRotation;
      const targetRotation = currentRotation + rounds * 360 + alignmentDelta;

      const duration = 4700 + Math.random() * 700;
      const startedAt = performance.now();
      let lastTickSegment = null;

      function animate(now) {
        const progress = Math.min((now - startedAt) / duration, 1);
        const eased = easeOutQuint(progress);
        const rotation = startRotation + (targetRotation - startRotation) * eased;

        currentRotation = rotation;
        wheel.style.transform = `rotate(${rotation}deg)`;

        const tickSegment = Math.floor(normalizeDegrees(rotation + segmentAngle / 2) / segmentAngle);

        if (tickSegment !== lastTickSegment) {
          playTick();
          lastTickSegment = tickSegment;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
          return;
        }

        currentRotation = targetRotation;
        wheel.style.transform = `rotate(${currentRotation}deg)`;

        const result = slices[winnerIndex];
        resultEl.innerHTML = `Az eredmény: <strong>${result}</strong>`;

        resultEl.classList.add("win-active");
        wheelStage.classList.add("winning");

        saveResult(result);
        playWinSound();
        launchConfetti();

        rotating = false;
        spinBtn.disabled = false;
      }

      requestAnimationFrame(animate);
    }

    spinBtn.addEventListener("click", spin);
    wheel.addEventListener("click", spin);

    playerNameEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") spin();
    });

    wheel.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        spin();
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!confirm("Biztosan törlöd az összes pörgetést?")) return;

      clearBtn.disabled = true;
      try {
        const snapshot = await getDocs(entriesCollection);
        await Promise.all(snapshot.docs.map((d) => deleteDoc(doc(db, "porgetesek", d.id))));
        await renderEntries();
        resultEl.classList.remove("win-active");
        wheelStage.classList.remove("winning");
        resultEl.textContent = "Az előzmények törölve.";
      } catch (err) {
        alert("Hiba történt a törlés során.");
      } finally {
        clearBtn.disabled = false;
      }
    });

    exportBtn.addEventListener("click", async () => {
      exportBtn.disabled = true;
      const data = await getEntries();
      exportBtn.disabled = false;

      if (!data) return;

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "szerencsekerek-porgetesek.json";
      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    function init() {
      buildWheel();
      renderEntries();
    }

    init();
  </script>
</body>
</html>
